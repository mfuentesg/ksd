version: 2

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - id: ksd
    binary: ksd
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    flags:
      - -trimpath

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Bug fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

homebrew_casks:
  - name: ksd
    binaries:
      - ksd
    repository:
      owner: mfuentesg
      name: homebrew-tap
      branch: main
    commit_author:
      name: mfuentesg
      email: marceloe.fuentes@gmail.com
    homepage: "https://github.com/mfuentesg/ksd"
    description: "Kubernetes Secret Decoder - decode base64-encoded secrets in YAML or JSON format"
    caveats: |
      Usage:
        kubectl get secret <secret-name> -o yaml | ksd
        kubectl get secret <secret-name> -o json | ksd
        ksd < secret.yaml

release:
  github:
    owner: mfuentesg
    name: ksd
  draft: false
  prerelease: auto
  mode: replace
  footer: |
    **Full Changelog**: https://github.com/mfuentesg/ksd/compare/{{ .PreviousTag }}...{{ .Tag }}
